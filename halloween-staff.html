<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lista Halloween</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#301c1b">

<link rel="icon" href="assets/icons/pubby-icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-32.png" sizes="32x32">

<link rel="preload" href="assets/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/forlifest-admin.css">
</head>

<!-- Lista di Halloween per gli organizzatori (Baila Bonita), in sola lettura.
     Non e' linkata da nessuna parte: l'indirizzo lo diamo a loro. La
     protezione pero' e' il login, non l'indirizzo (il repo e' pubblico).
     Chi entra vede solo cognome, nome, telefono e ora d'iscrizione, tramite
     halloween_lista_staff() (supabase/halloween.sql). Niente Forlì Fest,
     niente consenso marketing, niente cancellazioni. -->
<body class="adm"
      data-supabase-url="https://kntjqcusvqrstjeruffq.supabase.co"
      data-supabase-key="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtudGpxY3VzdnFyc3RqZXJ1ZmZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzMyNjMsImV4cCI6MjEwNjAwOTI2M30.wNh78u7gNKq-bu73Zs6BBH7MjgICYC5v4AiO14YN_40">

<header class="adm-head">
  <div class="wrap adm-head__bar">
    <div class="adm-brand">
      <img src="assets/logo-cream.png" alt="Pubby" width="84" height="30">
      <span class="adm-brand__x" aria-hidden="true">×</span>
      <span class="adm-brand__tile adm-brand__tile--clear"><img src="halloween/assets/baila-bonita.svg" alt="Baila Bonita" width="177" height="117"></span>
      <span class="adm-brand__name">Halloween · lista</span>
    </div>
    <button class="adm-link" id="logout" type="button" hidden>Esci</button>
  </div>
</header>

<main class="wrap adm-main">

  <!-- login -->
  <section id="login-view" hidden>
    <p class="eyebrow">Area organizzatori</p>
    <h1 class="adm-title">La lista<br>di Halloween</h1>
    <form class="adm-login" id="login-form" novalidate>
      <div class="adm-field">
        <label for="l-user">Nome utente</label>
        <input id="l-user" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" required>
      </div>
      <div class="adm-field">
        <label for="l-pass">Password</label>
        <input id="l-pass" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--red" type="submit" id="login-btn">Entra</button>
      <p class="adm-err" id="login-err" role="alert"></p>
    </form>
  </section>

  <!-- elenco, sola lettura -->
  <section id="list-view" hidden>
    <div class="adm-top">
      <div>
        <p class="eyebrow">Sabato 31 ottobre</p>
        <h1 class="adm-title adm-title--sm">Halloween</h1>
      </div>
      <div class="adm-actions">
        <button class="btn btn--ghost adm-btn" type="button" id="reload">Aggiorna</button>
        <button class="btn btn--ghost adm-btn" type="button" id="csv">Scarica CSV</button>
        <button class="btn btn--cream adm-btn" type="button" id="print">Stampa / PDF</button>
      </div>
    </div>

    <div class="adm-stats"><div class="adm-stat adm-stat--all"><span class="adm-stat__n" id="tot">0</span><span class="adm-stat__l">In lista</span></div></div>

    <div class="adm-filters">
      <label class="sr" for="q">Cerca</label>
      <input id="q" type="search" placeholder="Cerca nome o telefono" autocomplete="off">
    </div>

    <p class="adm-count" id="count"></p>
    <p class="adm-err" id="list-err" role="alert"></p>

    <div class="adm-table-wrap">
      <table class="adm-table">
        <thead>
          <tr>
            <th class="col-check" aria-label="Entrato"></th>
            <th>Cognome</th>
            <th>Nome</th>
            <th>Telefono</th>
            <th class="col-when">Iscritto il</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="adm-empty" id="empty" hidden>Ancora nessuno in lista.</p>
  </section>

</main>

<script src="assets/js/adm-core.js" defer></script>
<script src="assets/js/halloween-staff.js" defer></script>
</body>
</html>
